<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sweet Spot | Contact</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</head>
<body>
    
   <nav class="navbar bg-1 fg-2 md:navbar-expand">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"> The Sweet Spot</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarTogglerDemo02" aria-labelledby="navbarTogglerDemo02Label">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarTogglerDemo02Label">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav me-auto mb-2">
          <li class="nav-item"><a class="nav-link" aria-current="page" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
          <li class="nav-item"><a class="nav-link active"  href="contact.html">Contact</a></li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-outline theme-success" type="submit">Search</button>
        </form>
      </div>
    </dialog>
  </div>
</nav>


<main>
    <div class="container mt-5">

        <h1>Get in Touch!</h1>
        <p>Have a question, inquiry or concern? We'd love to hear from you!</p>

        <form>
            <div class="row g-3">

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName">
                    </div>
                </div>



                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName">
                    </div>
                </div>



                <div class="col-12">
                    <div class="form-field">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                </div>



                <div class="col-12">
                    <div class="form-field">
                        <label for="reason" class="form-label">What are you contacting us about?</label>
                        <select class="form-control" id="reason">

                        <option value="">Choose an option</option>
                        <option value="question">General Question</option>
                        <option value="suggestion">Suggestion</option>
                        <option value="inquiry">Inquiry</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>

                        </select>
                    </div>
                </div>



                <div class="col-12">
                    <div class="form-field">
                        <label for="message" class="form-label">Your Message:</label>
                        <textarea class="form-control" id="message" rows="5"></textarea>
                    </div>
                </div>



                <div class="col-12">
                    <div class="form-field">
                        <input type="checkbox" id="consent" class="check">
                        <label for="consent">I agree to be contacted regarding my inquiry.</label>
                    </div>
                </div>




                <div class="col-12">
                    <button type="submit" class="btn-solid theme-primary">Send Message</button>
                </div>

            </div>
        </form>

    </div>

</main>

<footer class="container mt-5">
    <p>© 2026 The Sweet Spot. All rights reserved.</p>
</footer>

</body>
</html>
